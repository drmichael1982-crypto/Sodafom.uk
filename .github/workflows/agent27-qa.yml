name: Agent27 isolated QA (no deployment)

on:
  push:
    branches:
      - agent27/full-app-qa-safe-fixes-20260913
    paths:
      - '.github/workflows/agent27-qa.yml'
      - 'scripts/qa/agent27/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # This repository is public. No checkout token, repository secret, Railway
      # credential, deployment action or production environment is used.
      - name: Read the exact Agent27 commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent27/full-app-qa-safe-fixes-20260913'
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:22-bookworm
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app node:22-bookworm \
            sh -c 'node --version && npm --version && npm ci --ignore-scripts --no-audit --no-fund'
      # Network isolation prevents tests/build plugins from reaching real user
      # data, paid AI, payment providers, email services or the deployed app.
      - name: Existing island regression tests (network isolated)
        id: islands
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/app" -w /app \
            -e CI=true -e NODE_ENV=test node:22-bookworm \
            node --test scripts/test-island-adventures.cjs
      - name: Existing Vitest suite (network isolated)
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/app" -w /app \
            -e CI=true -e NODE_ENV=test node:22-bookworm \
            npm test -- --run
      - name: Project type check (network isolated)
        id: types
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/app" -w /app \
            -e CI=true node:22-bookworm npm run type-check
      - name: Client and server build (network isolated)
        id: build
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/app" -w /app \
            -e CI=true node:22-bookworm npm run build
      - name: Report honest outcomes
        if: always()
        shell: bash
        env:
          ISLANDS: ${{ steps.islands.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          printf '## Agent27 baseline QA\n\nCommit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '| Check | Outcome |\n| --- | --- |\n| Existing island tests | %s |\n| Vitest | %s |\n| Type check | %s |\n| Build | %s |\n' "$ISLANDS" "$UNIT" "$TYPES" "$BUILD" >> "$GITHUB_STEP_SUMMARY"
          printf '\nThese are automated checks, not a real-device, microphone, camera or live-account end-to-end certification. No merge or deployment was performed.\n' >> "$GITHUB_STEP_SUMMARY"
          test "$ISLANDS" = success && test "$UNIT" = success && test "$TYPES" = success && test "$BUILD" = success
