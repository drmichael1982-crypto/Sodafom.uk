name: Archie interest themes

on:
  pull_request:
    paths:
      - "src/lib/interest-themes.ts"
      - "src/lib/__tests__/interest-themes.test.ts"
      - "src/components/ArchieHelper.tsx"
      - "src/pages/index.tsx"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/archie-interest-themes.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run build
      - run: pnpm exec vitest run src/lib/__tests__/interest-themes.test.ts
