name: Prepare reviewed code tree
on:
  push:
    branches: ['sodafom/live-colourful-review-2026-09-12']
    paths: ['.github/workflows/review-transfer.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'drmichael1982-crypto/Sodafom.uk' && github.ref == 'refs/heads/sodafom/live-colourful-review-2026-09-12'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Read source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz --strip-components=1
      - name: Apply checksum-verified edits and prepare Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib, hashlib, gzip, base64, json, urllib.request
          repo = 'drmichael1982-crypto/Sodafom.uk'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/sodafom/live-colourful-review-2026-09-12'
          allowed = {
            'docs/COLOURFUL_REVIEW_2026-09-12.md',
            'src/components/ArchieHelper.tsx', 'src/components/Blackboard.tsx',
            'src/components/SystemMonitor.tsx', 'src/components/__tests__/colourful-learning.test.tsx',
            'src/components/museum/MuseumWalkthrough.tsx', 'src/hooks/__tests__/useLessonConversation.test.ts',
            'src/hooks/useLessonConversation.ts', 'src/layouts/RootLayout.tsx', 'src/lib/config.ts',
            'src/pages/MuseumExplorerPage.tsx', 'src/pages/admin-panel.tsx', 'src/pages/tutor/TeacherModePage.tsx',
            'src/server/api/admin/code/GET.ts', 'src/server/api/admin/system-monitor/GET.ts',
            'src/server/entry.ts', 'src/styles/colourful.css'
          }
          encoded = ''.join(pathlib.Path(f'.review-transfer/part{i}.txt').read_text().strip() for i in range(1,4))
          assert len(encoded) == 26804, 'Transfer length mismatch'
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 62110
          assert hashlib.sha256(raw).hexdigest() == '50e166201559694da651fe03f02d876fbdd45781e428d5efef93cc5eff52b2df', 'Transfer checksum mismatch'
          edits = json.loads(raw)
          assert {item['path'] for item in edits} == allowed and len(edits) == len(allowed)
          def digest(data): return hashlib.sha256(data).hexdigest()
          for item in edits:
              path = pathlib.Path(item['path'])
              assert not path.is_symlink()
              old = path.read_bytes() if path.exists() else None
              assert (digest(old) if old is not None else None) == item['old_sha256'], f'Base changed: {path}'
              lines = old.decode().splitlines(keepends=True) if old is not None else []
              previous = -1
              for edit in item['edits']:
                  assert 0 <= edit['start'] <= edit['end'] <= len(lines)
                  assert edit['start'] >= previous
                  previous = edit['end']
              for edit in reversed(item['edits']):
                  lines[edit['start']:edit['end']] = [edit['text']]
              data = ''.join(lines).encode()
              assert digest(data) == item['new_sha256'], f'Output checksum mismatch: {path}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          def api(path, payload=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'},
                  method='POST' if payload is not None else 'GET')
              with urllib.request.urlopen(request, timeout=30) as response: return json.load(response)
          parent = os.environ['GITHUB_SHA']
          base = api('/git/commits/' + parent)['tree']['sha']
          entries = []
          for item in edits:
              blob = api('/git/blobs', {'content':pathlib.Path(item['path']).read_text(), 'encoding':'utf-8'})
              entries.append({'path':item['path'], 'mode':'100644', 'type':'blob', 'sha':blob['sha']})
          # The one-time transfer files are absent from the resulting review tree.
          for path in ['.review-transfer/part1.txt','.review-transfer/part2.txt','.review-transfer/part3.txt','.github/workflows/review-transfer.yml']:
              entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
          tree = api('/git/trees', {'base_tree':base,'tree':entries})
          result = {'parent':parent,'tree':tree['sha'],'changed_files':sorted(allowed),'production_updated':False}
          pathlib.Path('/tmp/review-tree.json').write_text(json.dumps(result,indent=2))
          print('REVIEW_PARENT=' + parent)
          print('REVIEW_TREE=' + tree['sha'])
          print('No branch ref, account, payment, database or Railway deployment was modified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-code-tree
          path: /tmp/review-tree.json
          retention-days: 3
