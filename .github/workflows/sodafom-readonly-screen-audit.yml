name: Sodafom read-only screen audit
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/readonly-screen-audit.py'
      - '.github/workflows/sodafom-readonly-screen-audit.yml'
      - 'src/pages/ApprovedArtworkPage.tsx'
      - 'src/layouts/RootLayout.tsx'
permissions:
  contents: read
concurrency:
  group: sodafom-readonly-screen-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Audit public production screens without writes
        run: python scripts/readonly-screen-audit.py
      - name: Preserve screenshots and explicit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodafom-public-screen-audit
          path: qa-screen-results/
          retention-days: 7
          if-no-files-found: warn
