name: Sodafom read-only screen audit
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/readonly-screen-audit.py'
      - 'scripts/diagnose-public-navigation.py'
      - '.github/workflows/sodafom-readonly-screen-audit.yml'
      - 'src/pages/ApprovedArtworkPage.tsx'
      - 'src/layouts/RootLayout.tsx'
permissions:
  contents: read
concurrency:
  group: sodafom-readonly-screen-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Diagnose routing without changing production
        run: python scripts/diagnose-public-navigation.py
      - name: Preserve diagnostic screenshots and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodafom-navigation-diagnostic
          path: qa-navigation-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve public source for isolated QA, excluding environment files
        uses: actions/upload-artifact@v4
        with:
          name: sodafom-qa-source
          path: |
            src/
            public/
            export-plugins/
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
            tailwind.config.js
            postcss.config.js
            index.html
          include-hidden-files: false
          retention-days: 7
