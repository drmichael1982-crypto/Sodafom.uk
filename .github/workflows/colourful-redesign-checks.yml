name: Colourful redesign checks
on:
  push:
    branches: ['sodafom/colourful-redesign-2026-09-12']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: colourful-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare source snapshot (no credentials)
        run: |
          mkdir -p /tmp/sodafom-review
          git archive HEAD -- . ':!.env' ':!**/.env' ':!**/.env.*' ':!android' > /tmp/sodafom-review/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: sodafom-review-source
          path: /tmp/sodafom-review/source.tar
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Production client and server build
        run: npm run build
      - name: Type checking
        run: npm run type-check
      - name: Unit tests
        run: npm test -- --run
