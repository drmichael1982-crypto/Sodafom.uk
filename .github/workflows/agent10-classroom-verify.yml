name: Agent 10 Classroom Verification

on:
  push:
    branches:
      - agent10/classroom-lessons-20260913

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Agent 10 branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Classroom unit tests
        run: pnpm exec vitest run src/lib/tutor/classroom-system.test.ts
      - name: Type check
        run: pnpm type-check
      - name: Production build
        run: pnpm build
