name: Archie test build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run type-check
      - run: npx vitest run --maxWorkers=2 --testTimeout=20000
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check buttons and game routes
        run: |
          npm start > /tmp/archie-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/api/health && break; sleep 1; done
          node scripts/test-archie-ui.cjs
          node scripts/test-page-picture-jigsaw.cjs
      - name: Play simulated year-group games and spelling lessons
        run: node scripts/test-archie-search-journey.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archie-test-results
          path: test-results/
