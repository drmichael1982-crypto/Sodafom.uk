name: Agent 3D-02 Foundation CI

on:
  push:
    branches:
      - agent3d-02/r3f-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent3d-02-foundation
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Agent 02 branch
        uses: actions/checkout@v4
        with:
          ref: agent3d-02/r3f-foundation
          fetch-depth: 0

      - name: Use Node 22.22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Enable pnpm 11.23.0
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm --version

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Full repository type-check baseline
        id: full_typecheck
        continue-on-error: true
        run: pnpm type-check

      - name: Agent 02 scoped type-check
        run: pnpm exec tsc -p tsconfig.agent3d-02.json --noEmit

      - name: Agent 02 focused tests
        run: pnpm exec vitest run src/components/three

      - name: Production build
        run: pnpm build

      - name: Record inherited baseline status
        if: always()
        run: |
          echo "Full repository type-check outcome: ${{ steps.full_typecheck.outcome }}"
          if [ "${{ steps.full_typecheck.outcome }}" = "failure" ]; then
            echo "The repository baseline has type errors outside Agent 02 ownership; Agent 02 scoped type-check remains the gating check."
          fi
