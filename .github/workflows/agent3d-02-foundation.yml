name: Agent 3D-02 Foundation CI

on:
  push:
    branches:
      - agent3d-02/r3f-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent3d-02-foundation
  cancel-in-progress: true

jobs:
  foundation:
    if: ${{ github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, '[agent3d-02 deps]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Agent 02 branch
        uses: actions/checkout@v4
        with:
          ref: agent3d-02/r3f-foundation
          fetch-depth: 0

      - name: Use Node 22.22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Enable pnpm 11.23.0
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm --version

      - name: Pin 3D runtime dependencies
        run: |
          pnpm add --save-exact three @react-three/fiber @react-three/drei
          pnpm add --save-dev --save-exact @types/three

      - name: Commit dependency lock changes when required
        id: deps
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(agent3d-02): pin Three.js foundation deps [agent3d-02 deps]"
          git push origin HEAD:agent3d-02/r3f-foundation
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Agent 02 focused tests
        run: pnpm test -- --run src/components/three

      - name: Production build
        run: pnpm build
