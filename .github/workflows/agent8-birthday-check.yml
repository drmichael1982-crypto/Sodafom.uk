name: Agent 8 Birthday Party Check

on:
  push:
    branches:
      - agent8/birthday-party-room-20260913

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint src/pages/BirthdayPage.tsx
      - run: pnpm type-check
      - run: pnpm test -- --run
      - run: pnpm build
