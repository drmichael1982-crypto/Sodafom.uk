<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1510" viewBox="0 0 1120 1510" role="img" aria-labelledby="title desc">
<title id="title">ART-02 Sodafom Town route schematic</title>
<desc id="desc">A source-based map of the React Town's six entrance cards and eight registered app links, with separate concept-only areas and conflicting PR 31 prototypes. It is not an approved aerial scene. Runtime and physical phone tests are not claimed.</desc>
<style>
text{font-family:DejaVu Sans,Arial,sans-serif;fill:#15304a}
.title{font-size:31px;font-weight:700}
.subtitle{font-size:18px;fill:#4c6278}
.kicker{font-size:16px;font-weight:700;letter-spacing:.6px}
.card-title{font-size:22px;font-weight:700}
.body{font-size:18px}
.code{font-family:DejaVu Sans Mono,monospace;font-size:17px;fill:#12674c}
.small{font-size:16px;fill:#52697c}
.warn{font-size:18px;fill:#875613}
.band-title{font-size:21px;font-weight:700}
.error{font-size:17px;font-weight:700;fill:#b4232f}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#708799"/></marker></defs>
<rect width="1120" height="1510" fill="#f2f6fa"/>
<text x="48" y="51" class="title">SODAFOM · Town entrance map</text><text x="48" y="83" class="subtitle">ART-02  |  Schematic from code — not approved scenery or aerial geometry</text><rect x="48" y="110" width="1024" height="122" rx="19" fill="#e4effa" stroke="#7ca4c6" stroke-width="2"/><text x="72" y="147" class="card-title">TOWN / HOME — React preview in PR #30</text><text x="72" y="177" class="body">Default client view without “classic”; ?classic=1 opens the existing app.</text><text x="72" y="207" class="small">Six cards follow source order. Internal TOWN button returns to the square.</text><text x="48" y="259" class="kicker">APP ENTRANCES · 8 TARGETS DECLARED IN SOURCE · RUNTIME NOT TESTED</text><path d="M560 232V240 M560 272V771" fill="none" stroke="#708799" stroke-width="2"/><path d="M560 354H544" fill="none" stroke="#708799" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 354H576" fill="none" stroke="#708799" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 536H544" fill="none" stroke="#708799" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 536H576" fill="none" stroke="#708799" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 708H544" fill="none" stroke="#708799" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 708H576" fill="none" stroke="#708799" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="280" width="496" height="172" rx="18" fill="#ffffff" stroke="#b3d7c8" stroke-width="2"/><rect x="48" y="280" width="7" height="172" rx="3" fill="#16835f"/><text x="70" y="315" class="card-title">School</text><text x="70" y="347" class="code">/lessons?classic=1</text><text x="70" y="372" class="body">Illustrated subject doors → /tutor</text><text x="70" y="397" class="body">Other school cards describe concepts.</text><text x="70" y="422" class="body">Owner: Town entrance / lesson owner</text></g><g><rect x="576" y="280" width="496" height="172" rx="18" fill="#ffffff" stroke="#b3d7c8" stroke-width="2"/><rect x="576" y="280" width="7" height="172" rx="3" fill="#16835f"/><text x="598" y="315" class="card-title">Sports Centre (add ?classic=1)</text><text x="598" y="347" class="code">/games/football-times-tables</text><text x="598" y="372" class="error">/games/pool-science (cue sport)</text><text x="598" y="397" class="code">/games/basketball-grammar</text><text x="598" y="422" class="error">WRONG: swimming opens cue-sport pool.</text></g><g><rect x="48" y="470" width="496" height="154" rx="18" fill="#ffffff" stroke="#b3d7c8" stroke-width="2"/><rect x="48" y="470" width="7" height="154" rx="3" fill="#16835f"/><text x="70" y="505" class="card-title">Library</text><text x="70" y="537" class="code">/reading?classic=1</text><text x="70" y="562" class="body">Landing → books=1 or scan=1</text><text x="70" y="587" class="body">Preserve Agent 9 books / Agent 12 scan.</text></g><g><rect x="576" y="470" width="496" height="154" rx="18" fill="#ffffff" stroke="#b3d7c8" stroke-width="2"/><rect x="576" y="470" width="7" height="154" rx="3" fill="#16835f"/><text x="598" y="505" class="card-title">Museum</text><text x="598" y="537" class="code">/museum?classic=1</text><text x="598" y="562" class="body">Existing MuseumExplorerPage</text><text x="598" y="587" class="body">Preserve existing galleries and artwork.</text></g><g><rect x="48" y="642" width="496" height="154" rx="18" fill="#ffffff" stroke="#b3d7c8" stroke-width="2"/><rect x="48" y="642" width="7" height="154" rx="3" fill="#16835f"/><text x="70" y="677" class="card-title">Theatre</text><text x="70" y="709" class="code">/archie-theatre?classic=1</text><text x="70" y="734" class="body">Approved theatre door → /cartoons</text><text x="70" y="759" class="body">Player owner: Agent 7 / PR #28</text></g><g><rect x="576" y="642" width="496" height="154" rx="18" fill="#ffffff" stroke="#b3d7c8" stroke-width="2"/><rect x="576" y="642" width="7" height="154" rx="3" fill="#16835f"/><text x="598" y="677" class="card-title">Old Shops</text><text x="598" y="709" class="code">/sodafom-shop?classic=1</text><text x="598" y="734" class="body">Approved door → /shop/back-to-school</text><text x="598" y="759" class="body">Sweet-shop world is separate in PR #31.</text></g><rect x="48" y="817" width="1024" height="217" rx="18" fill="#fff5df" stroke="#d9b16c" stroke-width="2"/><text x="72" y="853" class="band-title">CONCEPT / LOCAL SCENE — no downstream app link</text><text x="72" y="887" class="warn">Funfair: carousel and balloons; game cards only change speech.</text><text x="72" y="918" class="warn">Wild Man: local story room. King's Head / Castle Path: speech only.</text><text x="72" y="949" class="warn">Shuttle: calls the same Archie movement; no animated shuttle ride.</text><text x="72" y="985" class="body">Standalone town-preview: all entrances are modal/speech concepts.</text><text x="72" y="1012" class="small">Its server returns the same HTML for non-health paths; HTTP 200 proves no route.</text><rect x="48" y="1054" width="1024" height="295" rx="18" fill="#f2edf9" stroke="#af98c5" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="1091" class="band-title">SEPARATE PR #31 PROTOTYPES — ownership review required</text><rect x="72" y="1110" width="466" height="82" rx="13" fill="#ffffff" stroke="#b7a5cc"/><text x="88" y="1138" class="body">Sports Centre → Library</text><text x="88" y="1163" class="small">/sports-centre.html → /library-world.html</text><text x="88" y="1183" class="small">Local prototypes; preserve real PE/reader owners.</text><rect x="582" y="1110" width="466" height="82" rx="13" fill="#ffffff" stroke="#b7a5cc"/><text x="598" y="1138" class="body">Village → Funfair</text><text x="598" y="1163" class="small">/village-sweet-shop.html → /fairground.html</text><text x="598" y="1183" class="small">Existing village/fairground owner retains scenery.</text><text x="72" y="1224" class="body">Sports and Library also link to Village and Funfair; four global buttons exist.</text><text x="72" y="1254" class="body">Town Fair Games has no link to these pages at the inspected Town head.</text><text x="72" y="1284" class="body">Library scan is simulated. Local progress is not the app's saved progress.</text><text x="72" y="1321" class="kicker">Next: agree one Town → existing Library → Town loop, then extend the contract.</text><text x="48" y="1383" class="small">SOURCE: Town 72812932facc · stable routes 442656b4e2ec · PR #31 9c8d1f752839</text><text x="48" y="1412" class="small">Green = declared route. Red = wrong swimming link. Amber = concept. See ART-02-TOWN.md.</text><text x="48" y="1445" class="kicker">APP RUNTIME / PHYSICAL PHONE: NOT TESTED BY ART-02</text><text x="48" y="1476" class="small">No character-image publication, new scenery, merge or deployment.</text></svg>
