<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Samsung A10 and other older Android WebViews do not provide the ES2022
      // Object.hasOwn helper. Install the standards-compatible fallback before
      // any application or vendor JavaScript is evaluated.
      if (typeof Object.hasOwn !== "function") {
        Object.hasOwn = function (object, property) {
          return Object.prototype.hasOwnProperty.call(Object(object), property);
        };
      }
    </script>
    <script>
      // Capacitor startup guard: make pre-React failures visible instead of a white screen.
      (function () {
        function showStartupError() {
          try {
            var existing = document.getElementById("sodafom-startup-error");
            if (existing) return;
            var box = document.createElement("div");
            box.id = "sodafom-startup-error";
            box.style.cssText =
              "position:fixed;inset:0;z-index:2147483647;background:#edf7ff;color:#173268;padding:clamp(20px,6vw,60px);overflow:auto;font:18px/1.6 system-ui,sans-serif";
            var heading = document.createElement("h1");
            heading.textContent = "Let’s open your learning again";
            var message = document.createElement("p");
            message.textContent =
              "This activity could not load. Try reloading the app, or return home and choose another activity.";
            var reload = document.createElement("button");
            reload.textContent = "Reload app";
            reload.style.cssText =
              "min-height:48px;padding:12px 20px;border:0;border-radius:14px;background:#0962ce;color:white;font:inherit;font-weight:700;margin:12px 20px 12px 0;cursor:pointer";
            reload.addEventListener("click", function () {
              location.reload();
            });
            var home = document.createElement("a");
            home.textContent = "Back home";
            home.href =
              location.protocol === "capacitor:" ||
              location.protocol === "ionic:"
                ? "#/"
                : "/";
            home.style.cssText =
              "display:inline-block;min-height:48px;padding:12px 20px;border-radius:14px;background:#ffdd62;color:#173268;font-weight:700";
            box.appendChild(heading);
            box.appendChild(message);
            box.appendChild(reload);
            box.appendChild(home);
            document.addEventListener(
              "DOMContentLoaded",
              function () {
                document.body.appendChild(box);
              },
              { once: true },
            );
            if (document.body) document.body.appendChild(box);
          } catch (_) {}
        }
        window.addEventListener("error", function (e) {
          if (e.error || e.message) showStartupError();
        });
        window.addEventListener("unhandledrejection", function () {
          showStartupError();
        });
      })();
    </script>
    <script>
      (function () {
        try {
          var u = new URL(location.href);
          if (u.searchParams.has("airoShareToken")) {
            u.searchParams.delete("airoShareToken");
            history.replaceState(null, "", u.toString());
          }
        } catch (e) {}
      })();
    </script>
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--app-head-->
    <script src="/airo-video-slots.js"></script>
    <script src="/airo-logo-orientation.js"></script>
  </head>
  <body class="fs-unmask-airo-app-builder">
    <div id="app" class="fs-unmask-airo-app-builder">
      <!--app-html-->
      <div style="color: white; padding: 20px">Loading Sodafom...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/analytics.js"></script>
  </body>
</html>
