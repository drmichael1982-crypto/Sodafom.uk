<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6A4F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4a35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="1100" cy="80" r="180" fill="#FFD700" opacity="0.08" />
  <circle cx="100" cy="550" r="140" fill="#CC0000" opacity="0.08" />
  <circle cx="600" cy="-40" r="200" fill="#ffffff" opacity="0.04" />

  <!-- Card background -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Star badge -->
  <rect x="100" y="110" width="160" height="40" rx="20" fill="#FFD700" opacity="0.9" />
  <text x="180" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#1a4a35" text-anchor="middle">⭐ Ages 5–13</text>

  <!-- Main headline -->
  <text x="100" y="240" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-1">Sodafom</text>
  <text x="100" y="320" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFD700">Learn The Key To Success</text>

  <!-- Subtext -->
  <text x="100" y="390" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" opacity="0.8">Fun, curriculum-aligned learning games for children.</text>
  <text x="100" y="428" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" opacity="0.8">Maths · Spelling · Reading · Ages 5–13</text>

  <!-- Stats row -->
  <rect x="100" y="470" width="200" height="64" rx="16" fill="#ffffff" opacity="0.12" />
  <text x="200" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFD700" text-anchor="middle">25+</text>
  <text x="200" y="520" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.8" text-anchor="middle">Games</text>

  <rect x="320" y="470" width="200" height="64" rx="16" fill="#ffffff" opacity="0.12" />
  <text x="420" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFD700" text-anchor="middle">£1/mo</text>
  <text x="420" y="520" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.8" text-anchor="middle">After free trial</text>

  <rect x="540" y="470" width="200" height="64" rx="16" fill="#ffffff" opacity="0.12" />
  <text x="640" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFD700" text-anchor="middle">Ad-free</text>
  <text x="640" y="520" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.8" text-anchor="middle">Safe &amp; secure</text>

  <!-- Domain badge -->
  <rect x="900" y="470" width="240" height="64" rx="16" fill="#FFD700" opacity="0.9" />
  <text x="1020" y="510" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#1a4a35" text-anchor="middle">sodafom.uk</text>

  <!-- Emoji decorations -->
  <text x="1020" y="200" font-size="80" text-anchor="middle">🎓</text>
  <text x="1100" y="340" font-size="60" text-anchor="middle">⭐</text>
  <text x="940" y="300" font-size="50" text-anchor="middle">🎮</text>
</svg>
