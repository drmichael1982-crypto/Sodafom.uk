function attachRig(character,shirtColor='#2474c3'){
 const joints={arms:[],legs:[]};
 for(const side of [-1,1]){
  const shoulder=new THREE.Group();shoulder.position.set(side*.55,1.95,0);
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.6,4,8),mat(shirtColor));arm.position.y=-.5;shoulder.add(arm);character.add(shoulder);joints.arms.push(shoulder);
  const hip=new THREE.Group();hip.position.set(side*.27,.85,0);
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.65,4,8),mat('#304e79'));leg.position.y=-.48;hip.add(leg);character.add(hip);joints.legs.push(hip);
 }
 character.userData.rig=joints;return character;
