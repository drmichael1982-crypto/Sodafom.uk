<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SODAFOM Walkable Island Prototype</title><style>
body{margin:0;overflow:hidden;background:#87d8f6;font-family:system-ui}#hud{position:fixed;top:12px;left:12px;background:#ffffffdc;border-radius:14px;padding:12px;max-width:290px;z-index:2}#hud h1{font-size:18px;margin:0 0 5px}#hud p{font-size:12px;margin:0}#stick{position:fixed;bottom:24px;left:24px;width:130px;height:130px;border-radius:50%;background:#ffffff88;touch-action:none;z-index:3}#nub{position:absolute;left:43px;top:43px;width:44px;height:44px;border-radius:50%;background:#2364ad}#jump{position:fixed;bottom:44px;right:24px;border:0;border-radius:50%;width:78px;height:78px;background:#f4b735;font-weight:800;z-index:3}#status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px}canvas{display:block}</style></head><body>
<div id="hud"><h1>SODAFOM Island — Walk Around</h1><p>WASD / arrows to walk • drag left/right for 360° and up/down to tilt • space to jump. On phone use the joystick and swipe the scene. Prototype, not the finished island.</p></div><div id="stick"><div id="nub"></div></div><button id="jump">JUMP</button><div id="status">Explore the harbour, castle and museum</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
const scene=new THREE.Scene();scene.background=new THREE.Color('#8ad9fa');scene.fog=new THREE.Fog('#8ad9fa',75,180);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x557744,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-30,55,30);sun.castShadow=true;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c});const grass=mat('#74c969'),sand=mat('#e8cc89'),path=mat('#d7ad76'),stone=mat('#9a9baf'),roof=mat('#a84b65'),wood=mat('#805333'),blue=mat('#2365a9');
function box(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cylinder(x,y,z,r,h,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
const water=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:'#2d98cc',roughness:.35}));water.rotation.x=-Math.PI/2;water.position.y=-.5;scene.add(water);
box(0,-.05,0,112,.5,112,grass);box(0,.02,0,10,.08,100,path);box(0,.02,0,100,.08,9,path);
function building(x,z,w,d,h,color,name){box(x,h/2,z,w,h,d,mat(color));const r=box(x,h+1,z,w+2,2,d+2,roof);r.rotation.z=.06;box(x,.95,z+d/2+.07,2,1.9,.12,wood);for(let dx of [-w/3,w/3])box(x+dx,h*.62,z+d/2+.09,1.4,1.5,.15,blue);const label=document.createElement('canvas');label.width=512;label.height=96;const ctx=label.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,512,96);ctx.fillStyle='#183552';ctx.font='bold 44px sans-serif';ctx.textAlign='center';ctx.fillText(name,256,63);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(label)}));sprite.position.set(x,h+3.8,z);sprite.scale.set(9,1.7,1);scene.add(sprite)}
building(0,-32,19,14,11,'#d8c5ae','CASTLE');for(let x of [-9,9])for(let z of [-39,-25]){cylinder(x,7,z,2.4,14,stone);cylinder(x,15,z,3,2,roof)}

// Number Tower — distinct landmark on the east side of the island.
const towerX=42,towerZ=-35;
cylinder(towerX,10,towerZ,4.3,20,mat('#e5b9ed'));
for(let level=0;level<5;level++){const ring=cylinder(towerX,3+level*4,towerZ,4.65,.45,mat(level%2?'#f9cc4c':'#6baddd'));ring.castShadow=true}
const towerRoof=new THREE.Mesh(new THREE.ConeGeometry(5.6,7,8),mat('#8654bc'));towerRoof.position.set(towerX,23.5,towerZ);scene.add(towerRoof);
for(let level=1;level<=5;level++){const board=document.createElement('canvas');board.width=128;board.height=128;const c=board.getContext('2d');c.fillStyle='#fff5ce';c.fillRect(0,0,128,128);c.fillStyle='#392d78';c.font='bold 90px sans-serif';c.textAlign='center';c.fillText(String(level),64,96);const n=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(board)}));n.position.set(towerX,level*3.5+1,towerZ+4.5);n.scale.set(2.5,2.5,1);scene.add(n)}
const towerSign=document.createElement('canvas');towerSign.width=512;towerSign.height=96;const tc=towerSign.getContext('2d');tc.fillStyle='#fff';tc.fillRect(0,0,512,96);tc.fillStyle='#392d78';tc.font='bold 48px sans-serif';tc.textAlign='center';tc.fillText('NUMBER TOWER',256,64);const ts=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(towerSign)}));ts.position.set(towerX,30,towerZ);ts.scale.set(12,2.25,1);scene.add(ts);
building(-30,-12,15,13,8,'#b8d9d2','MUSEUM');building(30,-12,16,13,8,'#ead0a2','LIBRARY');building(-29,26,16,14,7,'#eab9bb','FUNFAIR');building(29,26,17,14,8,'#b2d0eb','CLASSROOM');
for(let i=0;i<35;i++){const a=i*2.399,r=36+(i%4)*4,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<9||Math.abs(z)<9)continue;cylinder(x,2,z,.55,4,wood);const crown=new THREE.Mesh(new THREE.ConeGeometry(3,7,7),mat('#258b47'));crown.position.set(x,7,z);scene.add(crown)}
box(0,.15,52,15,.5,15,sand);box(0,.35,58,7,.7,15,wood);const ship=box(0,1,67,9,2,18,wood);box(0,3,67,6,2,6,mat('#f7f1dc'));cylinder(0,8,67,.2,10,wood);const sail=new THREE.Mesh(new THREE.PlaneGeometry(7,8),new THREE.MeshStandardMaterial({color:'#f5f1df',side:THREE.DoubleSide}));sail.position.set(0,9,67);scene.add(sail);
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.4,5,10),mat('#2372c2'));body.position.y=1.4;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),mat('#f5c39a'));head.position.y=2.6;player.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.52,16,12),mat('#eac75a'));hair.scale.y=.38;hair.position.y=2.96;player.add(hair);scene.add(player);player.position.set(0,.25,43);
let yaw=0,pitch=.32,vy=0,jumping=false;const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space')jump()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));function jump(){if(!jumping){vy=8;jumping=true}}document.getElementById('jump').onclick=jump;
let joyX=0,joyY=0;const stick=document.getElementById('stick'),nub=document.getElementById('nub');function joystick(e){const b=stick.getBoundingClientRect(),x=e.clientX-b.left-65,y=e.clientY-b.top-65,l=Math.max(1,Math.hypot(x,y)),scale=Math.min(45,l)/l;joyX=x*scale/45;joyY=y*scale/45;nub.style.transform=`translate(${joyX*45}px,${joyY*45}px)`}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);joystick(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))joystick(e)});function release(){joyX=joyY=0;nub.style.transform=''}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
let lookPointer=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===lookPointer){yaw-=(e.clientX-lastX)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.005,-.85,1.15);lastX=e.clientX;lastY=e.clientY}});renderer.domElement.addEventListener('pointerup',()=>lookPointer=null);

// Interactive building entrances: approach a door and tap the building to enter.
const interior=new THREE.Group();scene.add(interior);interior.visible=false;
let activeInterior=null;const interactables=[{name:'Library',x:30,z:-12,w:16,d:13},{name:'Funfair',x:-29,z:26,w:16,d:14},{name:'Museum',x:-30,z:-12,w:15,d:13},{name:'Castle',x:0,z:-32,w:19,d:14},{name:'Classroom',x:29,z:26,w:17,d:14},{name:'Number Tower',x:42,z:-35,w:9,d:9}];
const enterButton=document.createElement('button');enterButton.textContent='ENTER';Object.assign(enterButton.style,{position:'fixed',right:'18px',top:'18px',padding:'15px',background:'#fff',borderRadius:'12px',border:'2px solid #2761a0',fontWeight:'bold',zIndex:'5',display:'none'});document.body.append(enterButton);
const backButton=document.createElement('button');backButton.textContent='← Back to island';Object.assign(backButton.style,{position:'fixed',right:'18px',top:'18px',padding:'15px',background:'#fff',borderRadius:'12px',border:'2px solid #2761a0',fontWeight:'bold',zIndex:'5',display:'none'});document.body.append(backButton);
function interiorBox(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);interior.add(o);return o}
function enter(name){activeInterior=name;interior.clear();interior.visible=true;for(const o of outdoorObjects)o.visible=false;player.position.set(0,.25,6);yaw=0;enterButton.style.display='none';backButton.style.display='block';document.getElementById('status').textContent=name+' — walk around inside';
interiorBox(0,-.3,0,24,.5,26,mat('#d9c4a5'));for(const [x,z,w,d] of [[-12,0,.5,26],[12,0,.5,26],[0,-13,24,.5],[0,13,24,.5]])interiorBox(x,4,z,w,8,d,mat('#f0dfc7'));
if(name==='Library'){for(const x of [-8,-4,4,8])for(const z of [-8,-3,3]){interiorBox(x,2,z,2.2,4,1.1,wood);for(let y=1;y<4;y++)interiorBox(x,y,z+0.62,1.9,.35,.18,mat(['#b34d67','#2b87a0','#d6ad3d'][y-1]))}}
else if(name==='Funfair'){for(const x of [-5,5]){const base=new THREE.Group();base.position.set(x,3,-2);interior.add(base);const ring=new THREE.Mesh(new THREE.TorusGeometry(3.3,.25,8,32),mat('#f4b735'));base.add(ring);for(let i=0;i<8;i++){const a=i*Math.PI/4;const seat=new THREE.Mesh(new THREE.BoxGeometry(.9,.8,.9),mat('#e964a2'));seat.position.set(Math.cos(a)*3.3,Math.sin(a)*3.3,0);base.add(seat)}base.userData.ride=true}}
else if(name==='Number Tower'){for(let i=1;i<=5;i++){interiorBox((i-3)*4,1,-4,3,2,2,mat(['#dba8e9','#f6ca5b','#82cce3','#f5a5a5','#9be0aa'][i-1]));const b=document.createElement('button');b.textContent='Floor '+i;b.style.cssText='position:fixed;bottom:'+ (125+i*38)+'px;right:12px;z-index:6;padding:8px';b.onclick=()=>document.getElementById('status').textContent='Number Tower floor '+i+' — maths activities coming next';document.body.append(b);floorButtons.push(b)}}
else{for(let x of [-6,0,6])interiorBox(x,1.1,-5,3,2,3,mat('#7da7d1'))}
}
const floorButtons=[];const outdoorObjects=[...scene.children].filter(o=>o!==interior&&o!==player&&o!==sun&&o.type!=='HemisphereLight'&&o.type!=='Fog');
function leave(){activeInterior=null;interior.visible=false;for(const o of outdoorObjects)o.visible=true;floorButtons.splice(0).forEach(b=>b.remove());player.position.set(0,.25,43);backButton.style.display='none';document.getElementById('status').textContent='Explore the harbour, castle and museum'}
backButton.onclick=leave;let near=null;enterButton.onclick=()=>{if(near)enter(near.name)};
renderer.domElement.addEventListener('click',e=>{if(activeInterior)return;const rect=renderer.domElement.getBoundingClientRect(),mouse=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);const ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(outdoorObjects,true);if(hits.length){const p=hits[0].point;const b=interactables.find(b=>Math.abs(p.x-b.x)<b.w/2+3&&Math.abs(p.z-b.z)<b.d/2+3);if(b){near=b;enterButton.textContent='Enter '+b.name;enterButton.style.display='block';document.getElementById('status').textContent='Selected '+b.name+' — tap Enter'}}});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(activeInterior){for(const o of interior.children)if(o.userData.ride)o.rotation.z+=dt*.7;}let forward=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0)-joyY;let side=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joyX;const len=Math.hypot(forward,side);if(len>.05){forward/=Math.max(1,len);side/=Math.max(1,len);const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*dt*7,dz=(-Math.cos(yaw)*forward+Math.sin(yaw)*side)*dt*7;const nx=player.position.x+dx,nz=player.position.z+dz;if((activeInterior?Math.abs(nx)<11&&Math.abs(nz)<12:Math.abs(nx)<54&&Math.abs(nz)<54)&&!(activeInterior?[]:[[0,-32,19,14],[-30,-12,15,13],[30,-12,16,13],[-29,26,16,14],[29,26,17,14]]).some(([x,z,w,d])=>Math.abs(nx-x)<w/2+.6&&Math.abs(nz-z)<d/2+.6)){player.position.x=nx;player.position.z=nz}player.rotation.y=Math.atan2(dx,dz)}vy-=20*dt;player.position.y=Math.max(.25,player.position.y+vy*dt);if(player.position.y===.25){vy=0;jumping=false}const distance=9;const target=player.position.clone().add(new THREE.Vector3(-Math.sin(yaw)*distance*Math.cos(pitch),2+distance*Math.sin(pitch),Math.cos(yaw)*distance*Math.cos(pitch)));camera.position.lerp(target,Math.min(1,dt*7));camera.lookAt(player.position.x,player.position.y+1.7,player.position.z);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
